[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-escalation-predictor"
version = "0.2.0"
description = "Explainable computer-vision research prototype for interaction risk cues."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{name = "August Kumar Sasmal"}]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "ultralytics>=8.3,<9",
  "mediapipe==0.10.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.6,<1"]

[project.scripts]
escalation-predictor = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["testing,py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
